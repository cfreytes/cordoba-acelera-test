name: Actualizar agenda

on:
  schedule:
    - cron: '0 9,21 * * *'   # todos los días a las 6 y a las 18 (hora de Córdoba)
  workflow_dispatch:           # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leer el Google Calendar
        run: python agenda/actualizar_agenda.py
      - name: Guardar los cambios
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add agenda/eventos.json
          git diff --staged --quiet || (git commit -m "Agenda actualizada" && git push)
