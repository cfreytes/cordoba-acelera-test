E%3Ccircle cx='85' cy='377' r='38' fill='none' stroke='%23FFFFFF' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='44 196' transform='rotate%28109 85 377%29'/%3E%3Ccircle cx='174' cy='441' r='31' fill='none' stroke='%23FFFFFF' stroke-width='2' stroke-linecap='round' stroke-dasharray='48 50' transform='rotate%28289 174 441%29'/%3E%3Ccircle cx='174' cy='441' r='40' fill='none' stroke='%23FFFFFF' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='41 211' transform='rotate%28172 174 441%29'/%3E%3Ccircle cx='96' cy='186' r='45' fill='none' stroke='%23FFFFFF' stroke-width='2' stroke-linecap='round' stroke-dasharray='57 84' transform='rotate%2851 96 186%29'/%3E%3Ccircle cx='96' cy='186' r='54' fill='none' stroke='%23FFFFFF' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='34 305' transform='rotate%28249 96 186%29'/%3E%3Ccircle cx='154' cy='286' r='31' fill='none' stroke='%23FFFFFF' stroke-width='2' stroke-linecap='round' stroke-dasharray='65 31' transform='rotate%2867 154 286%29'/%3E%3Ccircle cx='154' cy='286' r='40' fill='none' stroke='%23FFFFFF' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='35 213' transform='rotate%2859 154 286%29'/%3E%3Ccircle cx='286' cy='505' r='4.9' fill='%23FFFFFF'/%3E%3Ccircle cx='572' cy='162' r='3.5' fill='%23FFFFFF'/%3E%3Ccircle cx='608' cy='331' r='2.9' fill='%23FFFFFF'/%3E%3Ccircle cx='319' cy='15' r='5.5' fill='none' stroke='%23FFFFFF' stroke-width='1.5'/%3E%3Ccircle cx='62' cy='114' r='3.4' fill='%23FFFFFF'/%3E%3Ccircle cx='446' cy='74' r='4.5' fill='none' stroke='%23FFFFFF' stroke-width='1.5'/%3E%3Ccircle cx='280' cy='324' r='7.3' fill='none' stroke='%23FFFFFF' stroke-width='1.5'/%3E%3Ccircle cx='185' cy='105' r='5.6' fill='none' stroke='%23FFFFFF' stroke-width='1.5'/%3E%3Ccircle cx='348' cy='49' r='2.6' fill='%23FFFFFF'/%3E%3Ccircle cx='684' cy='129' r='4.6' fill='%23FFFFFF'/%3E%3Ccircle cx='428' cy='157' r='7.9' fill='none' stroke='%23FFFFFF' stroke-width='1.5'/%3E%3Ccircle cx='98' cy='250' r=   --radius-l:22px; --radius-m:14px; --radius-s:8px;
  color-scheme:light;
  background:var(--bg); color:var(--text);
  font-family:Montserrat, "Helvetica Neue", Arial, sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
#cba *,#cba *::before,#cba *::after{box-sizing:border-box}
#cba a{color:inherit}
#cba button{font-family:inherit;cursor:pointer}
#cba img{max-width:100%}
#cba :focus-visible{outline:2px solid var(--orange-hi);outline-offset:3px;border-radius:6px}
#cba h1[tabindex="-1"]:focus{outline:none}
#cba .wrap{max-width:1240px;margin:0 auto;padding:0 40px}
#cba h1,#cba h2,#cba h3,#cba p,#cba ul,#cba ol{margin:0}
#cba .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Barra superior ---------- */
#cba .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
#cba .bar .wrap{display:flex;align-items:center;gap:20px;min-height:72px}
#cba .brand{display:flex;align-items:center;flex:none}
#cba .brand img{height:42px;width:auto;display:block}
#cba .nav{display:flex;align-items:center;gap:2px;margin-left:auto}
#cba .nav > ul{list-style:none;padding:0;display:flex;align-items:center;gap:2px}
#cba .nav li{position:relative}
#cba .nav a.nl,#cba .nav button.nl{white-space:nowrap;text-decoration:none;font-size:14px;font-weight:600;color:var(--muted);padding:10px 14px;border-radius:999px;min-height:44px;display:inline-flex;align-items:center;gap:6px;background:none;border:0}
#cba .nav .nl:hover{color:var(--text);background:var(--surface)}
#cba .nav .nl[aria-current="page"]{color:var(--ink);background:var(--orange-wash)}
#cba .nav .nl svg{width:12px;height:12px;transition:transform .2s}
#cba .nav button.nl[aria-expanded="true"] svg{transform:rotate(180deg)}
#cba .nav .pill-agenda{border:1px solid #CFCAC2 !important;color:var(--text) !important;margin-left:8px}
#cba .nav .pill-agenda:hover{border-color:var(--orange) !important;background:transparent !important}
#cba .nav .pill-metas{background:var(--orange) !important;color:var(--ink) !important;font-weight:700 !important;margin-left:6px}
#cba .nav .pill-metas:hover,#cba .nav .pill-metas[aria-current="page"]{background:var(--orange-hi) !important;color:#fff !important}
#cba .drop{position:absolute;top:calc(100% + 8px);left:0;min-width:320px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(29,29,27,.16);display:none}
#cba .drop.open{display:block}
#cba .drop a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:600}
#cba .drop a:hover{background:var(--surface)}
#cba .drop a small{display:block;font-size:12.5px;font-weight:500;color:var(--soft);line-height:1.35}
#cba .drop .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none}
#cba .drop .sub a{padding:6px 12px 6px 32px;font-weight:500;color:var(--muted)}
#cba .drop .glabel{font-size:12px;font-weight:700;color:var(--orange-hi);padding:12px 12px 4px;border-top:1px solid var(--line);margin-top:6px}
#cba .burger{display:none;margin-left:auto;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:#fff;place-items:center}
#cba .burger svg{width:20px;height:20px}
@media (max-width:1120px){
  #cba .burger{display:grid}
  #cba .nav{position:fixed;left:0;right:0;bottom:0;top:calc(72px + env(safe-area-inset-top,0px));background:#fff;display:none;flex-direction:column;align-items:stretch;padding:16px 20px 40px;overflow-y:auto;margin:0}
  #cba .nav.open{display:flex}
  #cba .nav > ul{flex-direction:column;align-items:stretch;gap:4px}
  #cba .nav a.nl,#cba .nav button.nl{width:100%;justify-content:space-between;font-size:17px;padding:14px 16px}
  #cba .drop{position:static;box-shadow:none;border:0;border-left:2px solid var(--line);border-radius:0;margin:0 0 8px 16px;min-width:0;padding:4px 0}
  #cba .nav .pill-agenda,#cba .nav .pill-metas{justify-content:center;margin:8px 0 0}
}

/* ---------- Vistas y tipografía ---------- */
#cba .view{padding:56px 0 0;position:relative;overflow-x:clip}
#cba .view.enter{animation:cbaIn .38s cubic-bezier(.2,.7,.2,1)}
@keyframes cbaIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#cba .view::before{content:"";position:absolute;top:-40px;right:-60px;width:min(760px,62vw);height:560px;background:var(--net) no-repeat right top/contain;opacity:.6;pointer-events:none;-webkit-mask-image:linear-gradient(200deg,#000 35%,transparent 80%);mask-image:linear-gradient(200deg,#000 35%,transparent 80%)}
#cba .view.v-inicio::before,#cba .view.v-programas::before{display:none}
#cba .view.v-inicio,#cba .view.v-programas{padding-top:0}
#cba .view > .wrap,#cba .view > section{position:relative;z-index:1}
#cba .crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--soft);margin-bottom:28px}
#cba .crumbs a{color:var(--muted);text-decoration:none}
#cba .crumbs a:hover{color:var(--orange-hi)}
#cba .display{font-size:clamp(40px,5.4vw,72px);line-height:.98;font-weight:800;letter-spacing:-.045em}
#cba .h-xl{font-size:clamp(34px,4.4vw,54px);line-height:1.03;font-weight:800;letter-spacing:-.035em}
#cba .h-l{font-size:clamp(28px,3.2vw,40px);line-height:1.08;font-weight:800;letter-spacing:-.03em}
#cba .h-m{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.015em}
#cba .lead{font-size:19px;color:#3A3936;max-width:62ch}
#cba .body{font-size:16px;color:var(--muted);max-width:68ch}
#cba .fx-text{font-size:clamp(19px,1.8vw,22px);line-height:1.5;color:#2A2927;max-width:60ch}
#cba .section-gap{margin-top:96px}

#cba .btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;transition:background .15s,border-color .15s}
#cba .btn-primary{background:var(--orange);color:var(--ink)}
#cba .btn-primary:hover{background:var(--orange-hi)}
#cba .btn-ghost{border-color:#CFCAC2;color:var(--text);background:transparent}
#cba .btn-ghost:hover{border-color:var(--orange)}
#cba .btn-light{border-color:rgba(255,255,255,.55);color:#fff;background:transparent}
#cba .btn-light:hover{border-color:#fff;background:rgba(255,255,255,.1)}
#cba .btn svg{width:18px;height:18px;flex:none}

/* ---------- Sub-navegación (tabs) ---------- */
#cba .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 40px}
#cba .tabs a{min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);color:#3A3936;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;background:#fff}
#cba .tabs a:hover{border-color:var(--orange)}
#cba .tabs a[aria-current="page"]{background:var(--orange);border-color:var(--orange);color:var(--ink);font-weight:700}

/* ---------- Hero con video ---------- */
#cba .vhero{position:relative;min-height:min(82vh,760px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:var(--ink)}
#cba .vhero.short{min-height:min(56vh,520px)}
#cba .vhero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cba .vhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,29,27,.15) 0%,rgba(29,29,27,.35) 45%,rgba(29,29,27,.86) 100%)}
#cba .vhero .wrap{position:relative;z-index:2;width:100%;padding-top:120px;padding-bottom:64px}
#cba .vhero .lead{color:rgba(255,255,255,.88);margin-top:24px}
#cba .vhero .display{max-width:22ch;font-size:clamp(34px,4.6vw,62px);line-height:1.04}
#cba .vhero .hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
#cba .vhero .underline{display:inline;background:linear-gradient(var(--orange),var(--orange)) no-repeat 0 92%/100% .14em;padding-bottom:.04em}
#cba .vplay{position:absolute;right:24px;bottom:24px;z-index:3;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(29,29,27,.35);color:#fff;display:grid;place-items:center}
#cba .vplay:hover{background:rgba(29,29,27,.6)}
#cba .vplay svg{width:18px;height:18px}

/* ---------- Red de programas ---------- */
#cba .home-que{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:56px;padding:88px 0 0;align-items:start}
#cba .home-que .fx-text + .fx-text{margin-top:14px}
#cba .fx-text.muted{color:var(--muted)}
#cba .doors.three{grid-template-columns:repeat(3,minmax(0,1fr));padding-top:32px}
#cba .door.mini{grid-column:auto;min-height:150px;background:var(--surface) var(--net) no-repeat right -90px top -60px/420px auto}
#cba .door.mini:hover{background-color:var(--surface-2)}
#cba .eco{padding:96px 0 8px}
#cba .eco-head{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:56px;align-items:start;margin-bottom:12px}
#cba .eco-head .body{font-size:18px;max-width:62ch}
#cba .que-txt{margin-top:24px;display:flex;flex-direction:column;gap:16px;max-width:64ch}
#cba .que-txt a{color:var(--orange-hi);font-weight:700}
#cba .hero-actions{display:flex;flex-wrap:wrap;gap:12px}
#cba .eco-copy{display:flex;flex-direction:column;gap:24px}
#cba .actors{display:flex;flex-wrap:wrap;gap:8px}
#cba .actors span{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
#cba .actors i{width:10px;height:10px;border-radius:50%}
#cba .net-wrap{position:relative;width:100%;max-width:760px;margin:0 auto}
#cba svg.orbit{width:100%;display:block;overflow:visible}
#cba .orbit .m{stroke:#CFC9C0;stroke-width:1}
#cba .orbit .dot{fill:#BDB7AE}
#cba .orbit .ring{fill:none;stroke:#D9D4CC;stroke-width:1.2;stroke-dasharray:3 6}
#cba .orbit .spoke{stroke:var(--orange);stroke-width:1.4}
#cba .orbit .spoke.on{stroke-width:3}
#cba .orbit .peer{stroke:#BDB7AE;stroke-width:1;stroke-dasharray:2 5}
#cba .orbit .spark{fill:var(--orange)}
#cba .orbit .node{cursor:pointer;outline:none}
#cba .orbit .node .disc{fill:#fff;stroke:#E2C7B0;stroke-width:1.5;transition:stroke .2s}
#cba .orbit .node .halo{fill:none;stroke:var(--orange);stroke-width:2.5;opacity:0;transition:opacity .2s}
#cba .orbit .node.on .halo,#cba .orbit .node:focus-visible .halo{opacity:1}
#cba .orbit .node .lbl{fill:#1D1D1B;font:700 15px Montserrat,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:5px}
#cba .orbit .node .ini{fill:#1D1D1B;font:800 15px Montserrat,sans-serif}
#cba .orbit .core .disc{fill:var(--orange)}
#cba .orbit .core .word{fill:#fff;font:800 22px Montserrat,sans-serif;letter-spacing:-.02em}
#cba .orbit .ring-pulse{fill:none;stroke:var(--orange);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:cbaPulse 3.2s ease-out infinite}
@keyframes cbaPulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.7);opacity:0}}
#cba svg.web{width:100%;height:auto;display:block;overflow:visible;max-width:1080px;margin:0 auto}
#cba .web .peer{stroke:#CFC9C0;stroke-width:1.4;stroke-dasharray:2 6;stroke-linecap:round}
#cba .web .spoke{stroke-width:1.8;stroke-linecap:round;transition:opacity .2s}
#cba .web .tick{stroke-width:2;stroke-linecap:round}
#cba .web .arc{fill:none;stroke-width:2.4;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:cbaSpin 16s linear infinite}
#cba .web .arc.a2{stroke-width:1.8;animation-duration:24s;animation-direction:reverse}
#cba .web .node{cursor:pointer;outline:none;transition:opacity .25s}
#cba .web .node .disc{stroke-width:2.2}
#cba .web .node .lbl{fill:#1D1D1B;font-family:Montserrat,sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
#cba .web .node .ini{font:800 18px Montserrat,sans-serif}
#cba .web .node:focus-visible .disc{stroke-width:5}
#cba .web .hub .disc{fill:var(--orange)}
#cba .web .hub .word{fill:#fff;font:800 23px Montserrat,sans-serif;letter-spacing:-.02em}
#cba .web .hub .pulse{fill:none;stroke:var(--orange);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:cbaPulse 3.2s ease-out infinite}
#cba .graph-hint{font-size:13px;color:var(--soft);text-align:center;margin-top:4px}
#cba .net-tip{position:absolute;z-index:5;width:320px;padding:20px 22px;border-radius:18px;background:#fff;color:#1D1D1B;border:1px solid var(--line);box-shadow:0 24px 60px rgba(29,29,27,.18);display:flex;flex-direction:column;gap:10px}
#cba .net-tip[hidden]{display:none}
#cba .net-tip .tip-logo{height:48px;display:flex;align-items:center}
#cba .net-tip .tip-logo img{max-height:48px;max-width:190px;object-fit:contain}
#cba .net-tip .tip-sector{font-size:12px;font-weight:700;color:var(--orange-hi)}
#cba .net-tip .tip-name{font-size:17px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
#cba .net-tip p{font-size:14px;color:var(--muted);line-height:1.45;padding-top:10px;border-top:1px solid var(--line)}
#cba .net-tip .tip-go{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--orange);color:var(--ink);font-size:13px;font-weight:800;text-decoration:none}
#cba .net-tip .tip-go:hover{background:var(--ink);color:#fff}
#cba .net-tip .tip-go svg{width:14px;height:14px}

/* ---------- Puertas ---------- */
#cba .doors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;padding:56px 0 0}
#cba .door{grid-column:span 2;display:flex;flex-direction:column;gap:14px;min-height:200px;padding:28px;border-radius:var(--radius-l);background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:border-color .2s,background .2s}
#cba .door:hover{border-color:var(--orange);background:var(--surface-2)}
#cba .door.wide{grid-column:span 3}
#cba .door .h-m{font-size:24px}
#cba .door p{color:var(--muted);font-size:15px;max-width:40ch}
#cba .door .open{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px}
#cba .door .open svg{width:22px;height:22px;color:var(--orange);transition:transform .2s}
#cba .door:hover .open svg{transform:translate(3px,-3px)}

/* ---------- Banda naranja ---------- */
#cba .band{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px 56px;align-items:center;padding:48px;border-radius:var(--radius-l);background:var(--orange) var(--net-light) no-repeat right -40px center/auto 150%;color:var(--ink)}
#cba .band h2{font-size:clamp(26px,3vw,38px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:0 0 12px;max-width:22ch}
#cba .band p{font-size:16px;font-weight:600;line-height:1.5;max-width:56ch}
#cba .band .actions{display:flex;flex-wrap:wrap;gap:12px}
#cba .band .btn-dark{background:var(--ink);color:#fff}
#cba .band .btn-dark:hover{background:#000}
#cba .band .btn-ghost{border-color:rgba(29,29,27,.45);color:var(--ink)}
#cba .band .btn-ghost:hover{border-color:var(--ink)}

/* ---------- Split con columna fija ---------- */
#cba .split{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:56px;align-items:start}
#cba .sticky-col{position:sticky;top:110px;display:flex;flex-direction:column;gap:24px}
#cba .lines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#cba .line{padding:28px;border-radius:var(--radius-l);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
#cba .line-icon{width:52px;height:52px;border-radius:50%;background:var(--orange-wash);color:var(--orange);display:grid;place-items:center}
#cba .line-icon svg{width:24px;height:24px}
#cba .line p{color:var(--muted);font-size:15px}
#cba .line a.more{margin-top:auto;font-size:14px;font-weight:700;color:var(--orange-hi);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
#cba .line a.more:hover{text-decoration:underline}
#cba .line a.more svg{width:16px;height:16px;flex:none}
#cba .line.hl a.more{color:var(--ink)}
#cba .line.hl{background:var(--orange);border-color:var(--orange)}
#cba .line.hl p{color:var(--ink);font-weight:600}
#cba .line.hl .line-icon{background:rgba(29,29,27,.12);color:var(--ink)}

/* ---------- Tarjetas que giran ---------- */
#cba .flips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:40px}
#cba .flips.four{grid-template-columns:repeat(4,minmax(0,1fr))}
#cba .flip{perspective:1400px;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;min-height:320px;display:block;width:100%;border-radius:var(--radius-l)}
#cba .flip-inner{display:block;position:relative;width:100%;height:100%;min-height:320px;transition:transform .65s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
#cba .flip.is-flipped .flip-inner{transform:rotateY(180deg)}
@media (hover:hover){#cba .flip:hover .flip-inner{transform:rotateY(180deg)}}
#cba .flip:focus-within .flip-inner{transform:rotateY(180deg)}
#cba .flip{cursor:pointer}
#cba .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius-l);padding:30px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
#cba .front{background:var(--surface);border:1px solid var(--line)}
#cba .front .num{display:block;font-size:88px;font-weight:800;letter-spacing:-.06em;line-height:.85;color:var(--orange)}
#cba .front .ft{display:block;margin-top:auto;font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
#cba .front .turn{font-size:13px;font-weight:600;color:var(--soft);display:flex;align-items:center;gap:8px}
#cba .front .turn svg{width:16px;height:16px}
#cba .back{background:var(--orange);color:var(--ink);transform:rotateY(180deg)}
#cba .back .ft{display:block;font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
#cba .back .desc{display:block;font-size:15px;font-weight:600;line-height:1.5}
#cba .back .desc.lg{font-size:clamp(18px,1.7vw,21px);font-weight:700;line-height:1.4;margin:auto 0}
#cba .front.motif{background:var(--surface) var(--net) no-repeat right -90px top -70px/150%}
#cba .front.motif .ft{font-size:28px;max-width:14ch}
#cba .flip.prog .back{background:var(--pc,var(--orange))}
#cba .flip.prog .front{border-bottom:4px solid var(--pc,var(--orange))}
#cba .back .go{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}
#cba .back .go a{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:800;text-decoration:none}
#cba .back .go a.alt{background:rgba(29,29,27,.12);color:var(--ink)}
#cba .back .go a:hover{background:#000;color:#fff}
#cba .back .go svg{width:14px;height:14px}
/* Programa: logo al frente */
#cba .flip.prog .front{background:#fff}
#cba .flip.prog .plogo{height:96px;display:flex;align-items:center}
#cba .flip.prog .plogo img{max-height:84px;max-width:85%;object-fit:contain;display:block}
#cba .flip.prog .plogo .ini{display:none;width:84px;height:84px;border-radius:50%;background:var(--orange-wash);color:var(--orange-hi);font-weight:800;font-size:22px;place-items:center}
#cba .flip.prog .plogo.nologo img{display:none}
#cba .flip.prog .plogo.nologo .ini{display:grid}
#cba .flip.prog .aporte{display:inline-flex;align-self:flex-start;padding:6px 12px;border-radius:999px;background:var(--orange-wash);color:var(--orange-hi);font-size:12.5px;font-weight:700}
#cba .flip.prog .front .ft{font-size:22px}
/* Persona */
#cba .flip.person,#cba .flip.person .flip-inner{min-height:400px}
#cba .flip.person .front{padding:0;background:var(--surface-2)}
#cba .flip.person .front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cba .flip.person .front .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 24px 22px;background:linear-gradient(180deg,transparent,rgba(29,29,27,.82));color:#fff}
#cba .flip.person .front .cap b{display:block;font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
#cba .flip.person .front .cap span{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;font-weight:600;opacity:.85}
#cba .flip.person .front .cap svg{width:14px;height:14px}
#cba .flip.person .back .role{font-size:17px;font-weight:700;line-height:1.4}

/* ---------- Ecosistema (hélice) ---------- */
#cba .helix{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px) minmax(0,1fr);gap:24px 40px;align-items:center;margin-top:40px}
#cba .helix svg{width:100%;height:auto;display:block}
#cba .helix .r{fill:none;stroke-width:26;stroke-linecap:round}
#cba .helix .flow{fill:none;stroke:#1D1D1B;stroke-width:2;stroke-dasharray:6 8;opacity:.55}
#cba .helix .spin{transform-origin:210px 215px;animation:cbaSpin 40s linear infinite}
@keyframes cbaSpin{to{transform:rotate(360deg)}}
#cba .actor{padding:26px 28px;border-radius:var(--radius-l);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;transition:border-color .2s,transform .2s}
#cba .actor:hover{transform:translateY(-3px)}
#cba .actor .who{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
#cba .actor .who i{width:12px;height:12px;border-radius:50%}
#cba .actor b{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
#cba .actor p{font-size:15px;color:var(--muted)}
#cba .actor.a-estado{grid-column:2;grid-row:1}
#cba .actor.a-uni{grid-column:1;grid-row:2}
#cba .actor.a-emp{grid-column:3;grid-row:2}
#cba .helix .fig{grid-column:2;grid-row:2}
#cba .actor.a-estado:hover{border-color:var(--orange)}
#cba .actor.a-uni:hover{border-color:var(--blue)}
#cba .actor.a-emp:hover{border-color:var(--green)}
#cba .rel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}
#cba .rel p{padding:22px 26px;border-radius:var(--radius-m);border:1px dashed #CFCAC2;color:#3A3936;font-size:15px}

/* ---------- Cifras / datos institucionales ---------- */
#cba .cifras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-l);overflow:hidden;margin-top:40px}
#cba .cifra{background:var(--bg);padding:26px 28px;display:flex;flex-direction:column;gap:6px}
#cba .cifra strong{font-size:40px;font-weight:800;letter-spacing:-.04em;color:var(--orange);line-height:1.05}
#cba .cifra span{font-size:14px;color:#45433F}
#cba .destacado{margin-top:14px;padding:40px 44px;border-radius:var(--radius-l);background:var(--orange) var(--net-light) no-repeat right -40px center/auto 160%;color:var(--ink);font-size:clamp(22px,2.4vw,30px);font-weight:800;line-height:1.3;letter-spacing:-.02em}
#cba .destacado small{display:block;font-size:14px;font-weight:700;margin-bottom:10px;opacity:.8;letter-spacing:0}
#cba .chips{display:flex;flex-wrap:wrap;gap:10px}
#cba .chip{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:15px;background:#fff;text-decoration:none}
#cba .chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange)}
#cba a.chip:hover{border-color:var(--orange)}
#cba .fx-sec{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding:56px 0;border-bottom:1px solid var(--line)}
#cba .fx-sec:first-of-type{border-top:1px solid var(--line)}
#cba .fx-label{font-size:14px;font-weight:700;color:var(--orange-hi);padding-top:6px}

/* ---------- Metas públicas ---------- */
#cba .msum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-l);overflow:hidden;margin-top:36px}
#cba .msum div{background:var(--bg);padding:24px 26px}
#cba .msum strong{display:block;font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
#cba .msum span{display:block;margin-top:8px;font-size:14px;color:var(--muted)}
#cba .msum .ok strong{color:#2E7D4F}
#cba .msum .run strong{color:var(--orange)}
#cba .filters{display:flex;flex-wrap:wrap;gap:8px;margin:32px 0 0}
#cba .filters button{min-height:44px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:#3A3936;font-weight:600;font-size:14px}
#cba .filters button:hover{border-color:var(--orange)}
#cba .filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
#cba .mlist{display:flex;flex-direction:column;gap:14px;margin-top:24px}
#cba .mrow{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px 40px;padding:30px 32px;border-radius:var(--radius-l);background:var(--bg);border:1px solid var(--line)}
#cba .mrow .mtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
#cba .mrow .mid{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--ink);color:#fff}
#cba .mrow .mprog{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--orange-wash);color:var(--orange-hi)}
#cba .mrow .meje{font-size:13px;font-weight:600;color:var(--muted)}
#cba .mrow h3{font-size:19px;font-weight:700;line-height:1.4;letter-spacing:-.01em}
#cba .mrow .mind{margin-top:12px;font-size:14px;color:var(--muted)}
#cba .mrow .mind b{color:var(--text)}
#cba .mrow .mside{display:flex;flex-direction:column;gap:12px;padding-left:32px;border-left:1px solid var(--line)}
#cba .mrow .mlbl{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:-6px}
#cba .mrow .mpct{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
#cba .mrow .mpct strong{font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1}
#cba .mbadge{font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;white-space:nowrap}
#cba .mbadge.s-superada,#cba .mbadge.s-alcanzada{background:#E3F2E8;color:#1F6A3E}
#cba .mbadge.s-en-curso{background:var(--orange-wash);color:var(--orange-hi)}
#cba .mbadge.s-no-iniciada{background:var(--surface-2);color:var(--muted)}
#cba .mrow .pbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
#cba .mrow .pbar i{display:block;height:100%;border-radius:99px;background:var(--orange);transform-origin:left;animation:cbaGrow 1s cubic-bezier(.3,.7,.2,1) both}
@keyframes cbaGrow{from{transform:scaleX(0)}to{transform:none}}
#cba .mrow.done .pbar i{background:#2E7D4F}
#cba .mrow .manios{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
#cba .mrow .manios div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:700}
#cba .mrow .mev{margin-top:4px;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:14px;font-weight:800;color:var(--orange-hi);text-decoration:none;min-height:40px}
#cba .mrow .mev:hover{text-decoration:underline}
#cba .mrow .mev svg{width:16px;height:16px}
#cba .mrow.todo{border-style:dashed;border-color:#CFCAC2;grid-template-columns:minmax(0,1fr)}
#cba .mrow.todo h3{color:var(--muted)}

/* ---------- Novedades ---------- */
#cba .news{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}
#cba .new{display:flex;flex-direction:column;border-radius:var(--radius-l);background:var(--bg);border:1px solid var(--line);overflow:hidden;text-decoration:none;transition:border-color .2s,box-shadow .2s}
#cba a.new:hover{border-color:var(--orange);box-shadow:0 16px 40px rgba(29,29,27,.08)}
#cba .new .img{aspect-ratio:16/9;background:var(--orange-wash) var(--net) no-repeat center/cover;overflow:hidden}
#cba .new .img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
#cba a.new:hover .img img{transform:scale(1.04)}
#cba .new .txt{padding:24px 26px 28px;display:flex;flex-direction:column;gap:10px;flex:1}
#cba .new .meta-n{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--soft)}
#cba .new .meta-n b{color:var(--orange-hi);font-weight:700}
#cba .new h3{font-size:20px;font-weight:800;line-height:1.25;letter-spacing:-.015em}
#cba .new p{color:var(--muted);font-size:15px}
#cba .new .go{margin-top:auto;padding-top:8px;font-size:14px;font-weight:800;color:var(--orange-hi);display:inline-flex;gap:6px;align-items:center}
#cba .new .go svg{width:16px;height:16px}
#cba .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}

/* ---------- Documentos ---------- */
#cba .doc{display:grid;grid-template-columns:84px 140px minmax(0,1fr) 170px;gap:24px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
#cba .doc .cover{width:84px;height:108px;border-radius:10px;background:var(--surface) var(--net) no-repeat center/cover;border:1px solid var(--line);overflow:hidden}
#cba .doc .cover img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
#cba .doc .kind{font-size:13px;font-weight:700;color:var(--orange-hi)}
#cba .doc h3{font-size:19px;font-weight:700;line-height:1.3}
#cba .doc .who{font-size:14px;color:var(--muted);margin-top:4px}
#cba .doc .act{font-size:14px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
#cba .doc .act:hover{color:var(--orange-hi)}
#cba .doc .act svg{width:16px;height:16px}

/* ---------- Cierre y pie ---------- */
#cba .close{margin:96px 0 0;padding:56px 0 64px;background:var(--orange) var(--net-light) no-repeat right -40px center/auto 150%;color:var(--ink)}
#cba .close .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center}
#cba .close h2{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
#cba .close p{margin-top:10px;max-width:56ch;font-weight:500}
#cba .close .actions{display:flex;gap:12px;flex-wrap:wrap}
#cba .close .btn-primary{background:var(--ink);color:#fff}
#cba .close .btn-primary:hover{background:#000}
#cba .close .btn-ghost{border-color:rgba(29,29,27,.45);color:var(--ink)}
#cba .close .btn-ghost:hover{border-color:var(--ink)}
#cba .foot{background:var(--ink);color:#B8B7B0;padding:56px 0 28px;font-size:14px}
#cba .foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
#cba .foot h4{margin:0 0 14px;font-size:14px;font-weight:700;color:#fff}
#cba .foot ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
#cba .foot a{color:#B8B7B0;text-decoration:none}
#cba .foot a:hover{color:#fff}
#cba .foot .flogo{display:inline-flex;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:16px}
#cba .foot .flogo img{height:34px;width:auto;display:block}
#cba .social{display:flex;gap:8px;margin-top:16px}
#cba .social a{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;color:#fff}
#cba .social a:hover{background:var(--orange);border-color:var(--orange);color:var(--ink)}
#cba .social svg{width:18px;height:18px}
#cba .tci{display:flex;align-items:center;gap:12px;margin-top:4px}
#cba .tci img{height:40px;width:auto;background:#fff;border-radius:8px;padding:4px}
#cba .legal{margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px}

/* ---------- Responsive ---------- */
@media (max-width:1000px){
  #cba .eco,#cba .split,#cba .home-que,#cba .eco-head{grid-template-columns:minmax(0,1fr);gap:20px}
  #cba .sticky-col{position:static}
  #cba .door,#cba .door.wide{grid-column:span 3}
  #cba .flips,#cba .flips.four,#cba .news,#cba .cifras{grid-template-columns:repeat(2,minmax(0,1fr))}
  #cba .band,#cba .close .wrap{grid-template-columns:minmax(0,1fr)}
  #cba .mrow{grid-template-columns:minmax(0,1fr)}
  #cba .mrow .mside{padding-left:0;border-left:0;padding-top:20px;border-top:1px solid var(--line)}
  #cba .helix{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  #cba .helix .fig{grid-column:1/-1;grid-row:1;max-width:380px;justify-self:center;width:100%}
  #cba .actor.a-estado{grid-column:1/-1;grid-row:2}
  #cba .actor.a-uni{grid-column:1;grid-row:3}
  #cba .actor.a-emp{grid-column:2;grid-row:3}
  #cba .doc{grid-template-columns:72px minmax(0,1fr);row-gap:6px}
  #cba .doc .cover{grid-row:span 3;width:72px;height:92px}
  #cba .foot-grid{grid-template-columns:1fr 1fr}
  #cba .fx-sec{grid-template-columns:minmax(0,1fr);gap:16px}
}
@media (max-width:640px){
  #cba .wrap{padding:0 20px}
  #cba .bar .wrap{gap:12px}
  #cba .brand img{height:34px}
  #cba .view{padding-top:36px}
  #cba .door,#cba .door.wide{grid-column:1/-1}
  #cba .doors.three,#cba .lines,#cba .flips,#cba .flips.four,#cba .news,#cba .cifras,#cba .msum,#cba .rel{grid-template-columns:minmax(0,1fr)}
  #cba .flip,#cba .flip .flip-inner{min-height:280px}
  #cba .flip.person,#cba .flip.person .flip-inner{min-height:360px}
  #cba .helix{grid-template-columns:minmax(0,1fr)}
  #cba .actor.a-uni,#cba .actor.a-emp{grid-column:1;grid-row:auto}
  #cba .band,#cba .destacado{padding:32px 28px}
  #cba .mrow{padding:24px}
  #cba .foot-grid{grid-template-columns:minmax(0,1fr)}
  #cba .vhero .wrap{padding-bottom:48px}
}
@media (prefers-reduced-motion:reduce){
  #cba .view.enter,#cba .ring-pulse,#cba .helix .spin,#cba .mrow .pbar i{animation:none}
  #cba *{transition:none!important}
}
#cba .net-tip .tip-go{background:var(--pc,var(--orange))}
#cba .net-tip{border-top:4px solid var(--pc,var(--orange))}

/* ---------- Agenda ---------- */
#cba .ag-intro{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:start;margin-top:32px}
#cba .ag-intro .claim{font-size:clamp(34px,4vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--orange)}
#cba .ag-intro .fx-text + .fx-text{margin-top:14px}
#cba .ag-tools{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));z-index:6;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:48px 0 0;padding:16px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
#cba .ag-tools .filters{margin:0}
#cba .ag-search{flex:1 1 240px;max-width:360px;margin-left:auto;position:relative}
#cba .ag-search input{width:100%;min-height:44px;padding:10px 16px 10px 42px;border-radius:999px;border:1px solid var(--line);font:inherit;font-size:15px;background:#fff;color:var(--text)}
#cba .ag-search input:focus{outline:2px solid var(--orange-hi);outline-offset:1px;border-color:transparent}
#cba .ag-search svg{position:absolute;left:15px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--soft)}
#cba .ag-count{font-size:14px;color:var(--muted);margin-top:18px}
#cba .ag-month{font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:-.03em;margin:44px 0 6px}
#cba .ag-list{list-style:none;padding:0;margin:0}
#cba .ev{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:24px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
#cba .ev .d{width:92px;height:92px;border-radius:var(--radius-m);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#cba .ev .d b{font-size:36px;font-weight:800;letter-spacing:-.04em;color:var(--cat,var(--orange))}
#cba .ev .d span{font-size:12px;font-weight:700;color:var(--muted);margin-top:6px;text-transform:capitalize}
#cba .ev.today .d{background:var(--cat,var(--orange));border-color:transparent}
#cba .ev.today .d b,#cba .ev.today .d span{color:var(--ink)}
#cba .ev .cat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
#cba .ev .cat i{width:9px;height:9px;border-radius:50%;background:var(--cat,var(--orange))}
#cba .ev h3{font-size:19px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
#cba .ev .where{font-size:14px;color:var(--muted);margin-top:4px}
#cba .ev .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
#cba .ev .acts a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
#cba .ev .acts a:hover{border-color:var(--orange)}
#cba .ev .acts a.info{background:var(--ink);color:#fff;border-color:var(--ink)}
#cba .ev .acts a.info:hover{background:#000}
#cba .ev .acts svg{width:15px;height:15px}
#cba .ag-empty{padding:48px 32px;margin-top:32px;border:1px dashed #CFCAC2;border-radius:var(--radius-l);color:var(--muted);text-align:center}
#cba .ag-more{display:flex;justify-content:center;margin-top:32px}
#cba .ag-cal{margin-top:72px;padding:36px;border-radius:var(--radius-l);background:var(--surface);border:1px solid var(--line)}
#cba .ag-cal .sec-head p{color:var(--muted);margin-top:8px;max-width:56ch}
#cba .ag-cal .frame{margin-top:24px;border-radius:var(--radius-m);overflow:hidden;border:1px solid var(--line);background:#fff}
#cba .ag-cal iframe{display:block;width:100%;height:640px;border:0}
#cba .ag-legal{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:28px;font-size:14px}
#cba .ag-legal a{color:var(--orange-hi);font-weight:700}
#cba .band-ev{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-direction:column;gap:8px}
#cba .band-ev li{display:flex;gap:14px;align-items:baseline;font-size:15px;font-weight:600}
#cba .band-ev b{min-width:62px;font-weight:800}
@media (max-width:1000px){#cba .ag-intro{grid-template-columns:minmax(0,1fr);gap:20px}}
@media (max-width:640px){
  #cba .ev{grid-template-columns:64px minmax(0,1fr);gap:14px}
  #cba .ev .d{width:64px;height:64px}
  #cba .ev .d b{font-size:26px}
  #cba .ev .acts{grid-column:1/-1;justify-content:flex-start}
  #cba .ag-search{max-width:none;margin-left:0}
  #cba .ag-cal{padding:22px}
  #cba .ag-cal iframe{height:520px}
}

/* ---------- Ajustes v3 ---------- */
#cba .que-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:56px;align-items:start}
#cba .ficha{position:sticky;top:110px;margin-top:24px;padding:30px;border-radius:var(--radius-l);background:var(--ink) var(--net-light) no-repeat right -70px top -60px/260px auto;color:#fff;display:flex;flex-direction:column;gap:22px}
#cba .ficha-top{display:flex;align-items:baseline;gap:14px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.18)}
#cba .ficha-mark{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:.9;color:var(--orange)}
#cba .ficha-top span:last-child{font-size:14px;font-weight:700;color:#D8D6D0}
#cba .ficha dl{margin:0;display:flex;flex-direction:column;gap:16px}
#cba .ficha dt{font-size:12.5px;font-weight:700;color:var(--orange)}
#cba .ficha dd{margin:2px 0 0;font-size:16px;font-weight:600;line-height:1.4}
#cba .ficha dd a{color:#fff}
#cba .ficha-go{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;background:var(--orange);color:var(--ink);font-weight:800;font-size:14px;text-decoration:none}
#cba .ficha-go:hover{background:#fff}
#cba .ficha-go svg{width:16px;height:16px}
#cba .drop.progs{min-width:600px;left:50%;transform:translateX(-50%);padding:14px}
#cba .drop.progs .all{justify-content:space-between;font-weight:700;color:var(--orange-hi);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;margin-bottom:8px;padding:12px 14px}
#cba .drop.progs .all svg{width:16px;height:16px}
#cba .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#cba .drop .pitem{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;line-height:1.25}
#cba .drop .pitem:hover{background:var(--surface)}
#cba .pl{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;color:#fff;font-size:12px;font-weight:800}
#cba .pl img{width:78%;height:78%;object-fit:contain;display:block}
#cba .net-tip .tip-logo{height:auto;padding:10px 14px;border-radius:12px;align-self:flex-start}
#cba .net-tip .tip-logo img{max-height:40px}
#cba .web .node .disc{stroke-width:3}
#cba .web .node.on .disc,#cba .web .node:focus-visible .disc{stroke:var(--ink)}
#cba .flip.mini,#cba .flip.mini .flip-inner{min-height:236px}
#cba .flip.mini .face{padding:22px;gap:12px}
#cba .flip.mini .back{justify-content:space-between}
#cba .flip.mini .front .ft{font-size:24px}
#cba .flip.mini .back .desc{font-size:14.5px;font-weight:700;line-height:1.45}
#cba .flip.mini .back .go{margin-top:0}
#cba .flip.mini .go a{background:var(--ink);color:#fff}
@media (max-width:1120px){#cba .drop.progs{min-width:0;transform:none}#cba .pgrid{grid-template-columns:1fr}}
@media (max-width:1000px){#cba .que-grid{grid-template-columns:minmax(0,1fr);gap:32px}#cba .ficha{position:static}}

/* ---------- v4: aportes de la presidencia ---------- */
#cba .lang{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;flex:none;margin-left:10px}
#cba .lang button{min-width:40px;min-height:36px;border:0;border-radius:999px;background:transparent;font:700 13px Montserrat,sans-serif;color:var(--muted)}
#cba .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
#cba .btn-dark{background:var(--ink);color:#fff}
#cba .btn-dark:hover{background:#000}
#cba .vhero video,#cba .vhero::after{pointer-events:none}
#cba .vhero .hero-phrase{font-size:clamp(30px,3.9vw,56px);line-height:1.06;max-width:26ch}
#cba .muted-h{color:var(--soft);font-weight:700}
#cba .v-prog .eco-head{margin-bottom:0}
#cba .linkish{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--orange-hi);text-decoration:underline;cursor:pointer}

/* Triple hélice */
#cba .hx{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:40px;align-items:center;margin-top:28px}
#cba .hx-svg{width:100%;height:auto;display:block;overflow:visible}
#cba .hx-actor{cursor:pointer;outline:none}
#cba .hx-actor rect{fill:#fff;stroke:var(--c);stroke-width:3;transition:fill .2s}
#cba .hx-actor .n{font:800 22px Montserrat,sans-serif;fill:#1D1D1B}
#cba .hx-actor .s{font:600 16px Montserrat,sans-serif;fill:#55534E}
#cba .hx-actor:hover rect,#cba .hx-actor.on rect,#cba .hx-actor:focus-visible rect{fill:var(--c)}
#cba .hx-actor:hover text,#cba .hx-actor.on text,#cba .hx-actor:focus-visible text{fill:#fff}
#cba .hx-actor[data-hx="dir"] rect,#cba .hx-actor[data-hx="con"] rect{fill:var(--orange);stroke:var(--orange)}
#cba .hx-actor[data-hx="dir"] text,#cba .hx-actor[data-hx="con"] text{fill:#1D1D1B}
#cba .hx-actor[data-hx="dir"].on rect,#cba .hx-actor[data-hx="con"].on rect,#cba .hx-actor[data-hx="dir"]:hover rect,#cba .hx-actor[data-hx="con"]:hover rect{fill:var(--ink);stroke:var(--ink)}
#cba .hx-actor[data-hx="dir"].on text,#cba .hx-actor[data-hx="con"].on text,#cba .hx-actor[data-hx="dir"]:hover text,#cba .hx-actor[data-hx="con"]:hover text{fill:#fff}
#cba .hx-flow{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;stroke-dasharray:2 12;animation:cbaFlow 1.2s linear infinite;opacity:.7;transition:opacity .2s,stroke-width .2s}
#cba .hx-flow.on{opacity:1;stroke-width:8}
#cba .has-focus .hx-flow:not(.on){opacity:.2}
@keyframes cbaFlow{to{stroke-dashoffset:-14}}
#cba .hx-orbit{fill:none;stroke:#E2C7B0;stroke-width:2;stroke-dasharray:4 8}
#cba .hx-links line{stroke:#EC6907;stroke-opacity:.25;stroke-width:1.5}
#cba .hx-spin{transform-origin:450px 330px;animation:cbaSpin 60s linear infinite}
#cba .hx-core{fill:var(--orange)}
#cba .hx-word{font:800 20px Montserrat,sans-serif;fill:#fff}
#cba .hx-prog circle{stroke:#fff;stroke-width:3;transition:transform .2s;transform-box:fill-box;transform-origin:center}
#cba .hx-prog text{font:800 15px Montserrat,sans-serif;fill:#fff;pointer-events:none}
#cba .hx-prog:hover circle,#cba .hx-prog:focus-visible circle{transform:scale(1.12)}
#cba .hx-prog{outline:none}
#cba .hx-panel{padding:30px;border-radius:var(--radius-l);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-height:280px;justify-content:center}
#cba .hx-help{font-size:14px;font-weight:700;color:var(--orange-hi)}
#cba .hx-row{font-size:15px;color:var(--muted);padding-left:14px;border-left:3px solid var(--c)}
#cba .hx-row b{display:block;color:var(--text);font-size:16px}
#cba .hx-tag{align-self:flex-start;font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--c);color:#fff}
#cba .hx-name{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
#cba .hx-txt{font-size:18px;line-height:1.5;color:#3A3936}
#cba .hx-panel .tip-go{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;color:#fff;font-size:14px;font-weight:800;text-decoration:none}
#cba .hx-panel .tip-go svg{width:14px;height:14px}
#cba .hx-close{margin-top:32px;padding:32px 36px;border-radius:var(--radius-l);background:var(--orange) var(--net-light) no-repeat right -60px center/420px auto;color:var(--ink);font-size:clamp(19px,1.9vw,24px);font-weight:700;line-height:1.4;max-width:none}

/* Propósito */
#cba .prop{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:48px;align-items:start;margin-top:32px}
#cba .prop-main{font-size:clamp(20px,2vw,26px);line-height:1.45;font-weight:500;color:#2A2927}
#cba .pilares{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
#cba .pilares li{padding:18px 22px;border-radius:var(--radius-m);background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:800;letter-spacing:-.02em;animation:cbaIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 90ms)}
#cba .pilares li:nth-child(1){border-left:6px solid var(--orange)}
#cba .pilares li:nth-child(2){border-left:6px solid var(--blue)}
#cba .pilares li:nth-child(3){border-left:6px solid var(--green)}
#cba .pilares li:nth-child(4){border-left:6px solid var(--ink)}
#cba .prop + .destacado{margin-top:40px}

/* Equipo sin fotos */
#cba .pgrid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
#cba .pcard{display:flex;gap:16px;align-items:flex-start;padding:22px;border-radius:var(--radius-l);background:var(--surface);border:1px solid var(--line)}
#cba .pini{width:52px;height:52px;border-radius:50%;background:var(--orange);color:var(--ink);font-weight:800;font-size:17px;display:grid;place-items:center;flex:none}
#cba .pcard b{display:block;font-size:18px;font-weight:800;line-height:1.2}
#cba .pcard p{margin:6px 0 10px;font-size:14.5px;color:var(--muted);line-height:1.45}
#cba .pcard a{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--orange-hi);text-decoration:none;min-height:32px}
#cba .pcard a svg{width:14px;height:14px}

/* Anuarios */
#cba .anus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:36px}
#cba .anu{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;padding:32px;border-radius:var(--radius-l);background:var(--surface);border:1px solid var(--line)}
#cba .anu.hl{background:var(--orange) var(--net-light) no-repeat right -80px top -40px/360px auto;border-color:var(--orange)}
#cba .anu-y{font-size:clamp(56px,6vw,88px);font-weight:800;letter-spacing:-.06em;line-height:.85;color:var(--orange)}
#cba .anu.hl .anu-y{color:var(--ink)}
#cba .anu-body{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
#cba .anu-datos{list-style:none;padding:0;display:grid;gap:10px}
#cba .anu-datos strong{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
#cba .anu-todo{padding:14px 16px;border:1px dashed currentColor;border-radius:12px;font-size:14px;opacity:.75}
#cba .anu .btn svg{width:18px;height:18px}

/* Agenda con calendario */
#cba .ag-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:40px;align-items:start;margin-top:48px}
#cba .ag-side{position:sticky;top:96px;display:flex;flex-direction:column;gap:14px}
#cba .cal{padding:20px;border-radius:var(--radius-l);background:#fff;border:1px solid var(--line);box-shadow:0 18px 40px -24px rgba(29,29,27,.25)}
#cba .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
#cba .cal-head b{font-size:17px;font-weight:800}
#cba .cal-nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--text)}
#cba .cal-nav:hover{border-color:var(--orange)}
#cba .cal-nav svg{width:16px;height:16px}
#cba .cal-dows,#cba .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#cba .cal-dows span{text-align:center;font-size:12px;font-weight:700;color:var(--soft);padding:4px 0;text-transform:uppercase}
#cba .cd{aspect-ratio:1;border:0;border-radius:10px;background:transparent;font:600 14px Montserrat,sans-serif;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;min-height:36px}
#cba .cd.has{color:var(--text);background:var(--surface);cursor:pointer}
#cba .cd.has:hover{background:var(--surface-2)}
#cba .cd.is-past{opacity:.45}
#cba .cd.is-today span{color:var(--orange-hi);font-weight:800}
#cba .cd.is-today{box-shadow:inset 0 0 0 2px var(--orange)}
#cba .cd.is-sel{background:var(--ink) !important;color:#fff}
#cba .cd i{display:flex;gap:2px}
#cba .cd em{width:5px;height:5px;border-radius:50%}
#cba .cd:disabled{cursor:default}
#cba .ag-sub{padding:18px 20px;border-radius:var(--radius-l);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
#cba .ag-sub p{font-size:14px;color:var(--muted)}
#cba .ag-layout .ag-tools{margin-top:0;top:calc(72px + env(safe-area-inset-top,0px))}

/* Pie */
#cba .foot .seg{margin:6px 0 0;font-size:13px;font-weight:700;color:#fff}
#cba .btn-brochure{margin-top:18px;border:1px solid rgba(255,255,255,.3);color:#fff;min-height:44px;padding:10px 18px;font-size:14px}
#cba .btn-brochure:hover{background:var(--orange);border-color:var(--orange);color:var(--ink)}

/* Celular */
html.cba-lock,html.cba-lock body{overflow:hidden}
@media (max-width:1120px){
  #cba .bar{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff}
  #cba .lang{margin-left:auto}
  #cba .burger{margin-left:8px}
  #cba .nav{height:calc(100dvh - 72px - env(safe-area-inset-top,0px));overscroll-behavior:contain;z-index:40;box-shadow:0 1px 0 var(--line) inset}
  #cba .drop .sub a{padding-left:24px;min-height:44px}
  #cba .drop a{min-height:44px}
}
@media (max-width:1000px){
  #cba .hx,#cba .prop,#cba .anus,#cba .ag-layout{grid-template-columns:minmax(0,1fr)}
  #cba .ag-side{position:static;max-width:440px}
  #cba .hx-panel{min-height:0}
}
@media (max-width:640px){
  #cba .vhero{min-height:72svh}
  #cba .vhero .hero-phrase{font-size:28px}
  #cba .vhero .wrap{padding-top:80px}
  #cba .vplay{right:16px;bottom:16px}
  #cba .lang button{min-width:36px;min-height:34px}
  #cba .anu{grid-template-columns:minmax(0,1fr);padding:24px}
  #cba .hx-close{padding:24px}
}
@media (prefers-reduced-motion:reduce){#cba .hx-flow,#cba .hx-spin,#cba .pilares li{animation:none}}
#cba .vtodo{position:absolute;top:24px;left:50%;transform:translateX(-50%);z-index:3;padding:10px 18px;border-radius:999px;background:#FFE14D;color:#1D1D1B;font:800 14px Montserrat,sans-serif;border:2px dashed #1D1D1B;white-space:nowrap;pointer-events:none}
#cba .close .btn svg{width:18px;height:18px}
@media (max-width:640px){#cba .vtodo{top:14px;font-size:12px;padding:8px 14px}}
#cba .ag-count{scroll-margin-top:150px}
#cba .filters[hidden]{display:none}

/* ---------- v6 ---------- */
/* Ficha horizontal */
#cba .ficha.fh{position:static;margin-top:36px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px 40px;align-items:center;padding:30px 34px;background:var(--ink) var(--net-light) no-repeat right -50px bottom -80px/240px auto}
#cba .ficha.fh .ficha-top{grid-row:1/3;align-self:stretch;justify-content:center}
#cba .ficha.fh .ficha-top{flex-direction:column;align-items:flex-start;gap:6px;padding:0 36px 0 0;border-bottom:0;border-right:1px solid rgba(255,255,255,.18)}
#cba .ficha.fh dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 28px}
#cba .ficha.fh dd{font-size:15px}
#cba .ficha.fh .ficha-go{grid-column:2;justify-self:start;white-space:nowrap}
@media (max-width:1100px){#cba .ficha.fh{grid-template-columns:minmax(0,1fr)}#cba .ficha.fh .ficha-go{grid-column:1}#cba .ficha.fh .ficha-top{grid-row:auto;flex-direction:row;align-items:baseline;border-right:0;padding:0 0 16px;border-bottom:1px solid rgba(255,255,255,.18)}#cba .ficha.fh dl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){#cba .ficha.fh dl{grid-template-columns:minmax(0,1fr)}}

/* Desplegable Córdoba Acelera */
#cba .drop.cadrop{min-width:640px;padding:12px;left:50%;transform:translateX(-50%)}
#cba .cagrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:10px}
#cba .drop .cafeat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px;border-radius:16px;background:var(--orange) var(--net-light) no-repeat right -60px bottom -40px/260px auto;color:var(--ink);line-height:1.3}
#cba .drop .cafeat:hover{background-color:var(--orange-hi);color:#fff}
#cba .cafeat .ci{width:48px;height:48px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center}
#cba .cafeat .ci svg{width:26px;height:26px}
#cba .cafeat b{font-size:18px;font-weight:800;letter-spacing:-.015em}
#cba .drop .cafeat small{font-size:13px;font-weight:600;line-height:1.4;color:inherit;opacity:.9}
#cba .cafeat .cago{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800}
#cba .cafeat .cago svg{width:14px;height:14px}
#cba .calist{display:flex;flex-direction:column;gap:2px}
#cba .cal-lbl{font-size:12px;font-weight:800;color:var(--orange-hi);padding:8px 12px 4px}
#cba .cal-sep{height:1px;background:var(--line);margin:6px 12px}
#cba .drop .caitem{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:14px;line-height:1.3}
#cba .drop .caitem:hover{background:var(--surface)}
#cba .caitem .ci{width:40px;height:40px;border-radius:12px;color:#fff;display:grid;place-items:center;flex:none}
#cba .caitem .ci svg{width:21px;height:21px}
#cba .caitem b{display:block;font-size:14.5px;font-weight:800}
#cba .drop .caitem small{display:block;font-size:12.5px;font-weight:500;color:var(--soft);margin-top:2px}
@media (max-width:1120px){#cba .drop.cadrop{min-width:0;transform:none;padding:8px 0}#cba .cagrid{grid-template-columns:minmax(0,1fr)}#cba .drop .cafeat{padding:16px}}

/* Encabezado de la agenda */
#cba .ag-head{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px 56px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line)}
#cba .ag-claim{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:800;color:var(--orange-hi);margin-bottom:12px}
#cba .ag-claim::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 5px var(--orange-wash);animation:cbaBlink 1.8s ease-in-out infinite}
@keyframes cbaBlink{50%{box-shadow:0 0 0 9px rgba(236,105,7,0)}}
#cba .ag-desc{display:flex;flex-direction:column;gap:10px}
#cba .ag-desc p{font-size:16px;line-height:1.55;color:var(--muted);max-width:62ch}
#cba .ag-desc p:first-child{color:#2A2927;font-weight:500}
#cba .ag-layout{margin-top:36px}
@media (max-width:1000px){#cba .ag-head{grid-template-columns:minmax(0,1fr)}}

/* Tarjetas Propósito / Cultura / Equipo con ícono */
#cba .flip.mini.ico .front{background:#fff;overflow:hidden}
#cba .mi-ico{width:56px;height:56px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;position:relative;z-index:1;transition:transform .3s}
#cba .mi-ico svg{width:30px;height:30px}
#cba .mi-bg{position:absolute;right:-34px;bottom:-34px;width:150px;height:150px;color:var(--c);opacity:.13;transition:transform .5s}
#cba .mi-bg svg{width:100%;height:100%}
#cba .flip.mini.ico .front .ft{position:relative;z-index:1;margin-top:auto}
#cba .flip.mini.ico .front .turn{position:relative;z-index:1}
#cba .flip.mini.ico .back{background:var(--c);color:#fff}
#cba .flip.mini.ico .back .desc{color:#fff}
#cba .flip.mini.ico:hover .mi-bg{transform:rotate(-12deg) scale(1.08)}
#cba .flip.mini.ico{border-radius:var(--radius-l)}
#cba .flip.mini.ico .front{border-top:4px solid var(--c)}

/* Logo al centro de la red */
#cba .web .hub .disc{fill:#fff;stroke:var(--orange);stroke-width:4}
#cba .web .hub.nologo .disc{fill:var(--orange)}
#cba .hx-core{fill:#fff;stroke:var(--orange);stroke-width:4}
#cba .view.v-agenda::before{display:none}
</style>

  // Infografía del modelo de triple hélice: los tres actores alimentan a los programas;
  // el directorio y el consejo consultivo son la base.
  function helixMarkup() {
    var A = HELICE.actores;
    function box(k, x, y, w, h) {
      var a = A[k];
      return '<g class="hx-actor" data-hx="' + k + '" tabindex="0" role="button" aria-label="' + t(a.name) + ': ' + t(a.txt) + '" style="--c:' + a.color + '">' +
        '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h + '" rx="22"/>' +
        '<text class="n" x="' + x + '" y="' + (y - 4) + '" text-anchor="middle">' + t(a.name) + '</text>' +
        '<text class="s" x="' + x + '" y="' + (y + 22) + '" text-anchor="middle">' + t(a.sub) + '</text></g>';
    }
    function flow(k, d) { return '<path class="hx-flow" data-hx-flow="' + k + '" d="' + d + '" style="--c:' + A[k].color + '"/>'; }
    var cx = 450, cy = 330, R = 120, ring = '';
    PROGRAMAS.forEach(function (p, i) {
      var an = -Math.PI / 2 + i / PROGRAMAS.length * Math.PI * 2, x = cx + Math.cos(an) * R, y = cy + Math.sin(an) * R;
      ring += '<a href="' + p.url + '"' + ext(p.url) + ' class="hx-prog" data-hx-prog="' + i + '" aria-label="' + t(p.name) + '">' +
        '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="34" fill="' + p.color + '"/>' +
        '<text x="' + x.toFixed(1) + '" y="' + (y + 5).toFixed(1) + '" text-anchor="middle">' + p.ini + '</text></a>';
    });
    var links = '';
    for (var i = 0; i < PROGRAMAS.length; i++) for (var j = i + 2; j < PROGRAMAS.length; j += 2) {
      var a1 = -Math.PI / 2 + i / 7 * Math.PI * 2, a2 = -Math.PI / 2 + j / 7 * Math.PI * 2;
      links += '<line x1="' + (cx + Math.cos(a1) * R).toFixed(1) + '" y1="' + (cy + Math.sin(a1) * R).toFixed(1) + '" x2="' + (cx + Math.cos(a2) * R).toFixed(1) + '" y2="' + (cy + Math.sin(a2) * R).toFixed(1) + '"/>';
    }
    return '<svg class="hx-svg" viewBox="0 0 900 700" role="group" aria-label="' + t(HELICE.titulo) + '">' +
      flow('pub', 'M450 128 L450 196') + flow('aca', 'M218 330 L300 330') + flow('pri', 'M682 330 L600 330') +
      flow('dir', 'M260 596 L360 440') + flow('con', 'M640 596 L540 440') +
      '<g class="hx-spin"><circle class="hx-orbit" cx="' + cx + '" cy="' + cy + '" r="' + R + '"/><g class="hx-links">' + links + '</g></g>' +
      '<circle class="hx-core" cx="' + cx + '" cy="' + cy + '" r="62"/>' +
      '<image href="' + LOGO_CA + '" x="' + (cx - 50) + '" y="' + (cy - 30) + '" width="100" height="60" preserveAspectRatio="xMidYMid meet"/>' +
      
      ring +
      box('pub', 450, 82, 300, 88) + box('aca', 120, 330, 196, 88) + box('pri', 780, 330, 196, 88) +
      box('dir', 230, 640, 340, 76) + box('con', 670, 640, 340, 76) +
      '</svg>';
  }
  function wireHelix() {
    var panel = view.querySelector('[data-hx-panel]'); if (!panel) return;
    var svg = view.querySelector('.hx-svg');
    function idle() { svg.classList.remove('has-focus'); panel.innerHTML = '<p class="hx-help">' + t(HELICE.ayuda) + '</p>' + Object.keys(HELICE.actores).slice(0, 3).map(function (k) { var a = HELICE.actores[k]; return '<p class="hx-row" style="--c:' + a.color + '"><b>' + t(a.name) + '</b>' + t(a.txt) + '</p>'; }).join(''); }
    function show(k) {
      var a = HELICE.actores[k];
      svg.classList.add('has-focus');
      svg.querySelectorAll('[data-hx]').forEach(function (g) { g.classList.toggle('on', g.getAttribute('data-hx') === k); });
      svg.querySelectorAll('[data-hx-flow]').forEach(function (g) { g.classList.toggle('on', g.getAttribute('data-hx-flow') === k); });
      panel.innerHTML = '<span class="hx-tag" style="--c:' + a.color + '">' + t(a.sub) + '</span><b class="hx-name">' + t(a.name) + '</b><p class="hx-txt">' + t(a.txt) + '</p>';
    }
    function showProg(i) {
      var p = PROGRAMAS[i]; svg.classList.add('has-focus');
      svg.querySelectorAll('[data-hx],[data-hx-flow]').forEach(function (g) { g.classList.remove('on'); });
      panel.innerHTML = '<span class="hx-tag" style="--c:' + p.color + '">' + u('programas') + '</span><b class="hx-name">' + t(p.name) + '</b><p class="hx-txt">' + t(p.desc) + '</p>' +
        '<a class="tip-go" style="--pc:' + p.color + ';background:' + p.color + '" href="' + p.url + '"' + ext(p.url) + '>' + t(p.cta) + ' ' + ICONS.right + '</a>';
    }
    svg.querySelectorAll('[data-hx]').forEach(function (g) {
      var k = g.getAttribute('data-hx');
      g.addEventListener('mouseenter', function () { show(k); }); g.addEventListener('focus', function () { show(k); });
      g.addEventListener('click', function () { show(k); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(k); } });
    });
    svg.querySelectorAll('[data-hx-prog]').forEach(function (g) {
      var i = +g.getAttribute('data-hx-prog');
      g.addEventListener('mouseenter', function () { showProg(i); }); g.addEventListener('focus', function () { showProg(i); });
    });
    idle();
  }

  function lastM(m) { return m.anios ? m.anios[m.anios.length - 1] : [METAS_CORTE, m.estado, m.acumulado]; }
  function vMetas() {

    tip.onmouseleave = hideSoon;
    function setHover(k) {
      hover = k; svg.classList.toggle('has-hover', k >= 0);
      N.forEach(function (n) { n.a.classList.toggle('on', n.k === k); });
      if (k < 0) { tip.hidden = true; return; }
      var p = PROGRAMAS[k];
      tip.style.setProperty('--pc', p.color);
      tip.innerHTML = (p.logo ? '<span class="tip-logo" style="background:' + p.color + '"><img src="' + p.logo + '" alt="" onerror="this.parentNode.remove()"></span>' : '') +
        '<b class="tip-name">' + t(p.name) + '</b><p>' + t(p.desc) + '</p>' +
        '<a class="tip-go" href="' + p.url + '"' + ext(p.url) + '>' + t(p.cta) + ' ' + ICONS.right + '</a>';
      tip.hidden = false; placeTip();
    }
    function placeTip() {
      if (hover < 0 || tip.hidden) return;
      var n = N[hover], box = svg.getBoundingClientRect(), wb = wrap.getBoundingClientRect(), k = box.width / L.w;
      var x = box.left - wb.left + n.cx * k, y = box.top - wb.top + n.cy * k, tw = tip.offsetWidth, th = tip.offsetHeight, gap = (n.r + 22) * k;
      var left = x + gap; if (left + tw > wb.width) left = x - gap - tw;
      if (left < 0) { left = Math.max(0, Math.min(x - tw / 2, wb.width - tw)); y = y + gap + th / 2; }
      tip.style.left = left + 'px'; tip.style.top = Math.max(0, Math.min(y - th / 2, wb.height - th)) + 'px';
    }
    function tickAt(n, f) {
      var dx = n.cx - HX, dy = n.cy - HY, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
      var px = HX + dx * f, py = HY + dy * f, s = 7;
      return [px - uy * s, py + ux * s, px + uy * s, py - ux * s];
    }
    function frame(now) {
      if (!svg.isConnected || svg._t !== token) return;
      var m = reduce ? 0 : 1;
      N.forEach(function (n) {
        n.cx = n.x + m * 6 * Math.sin(now * 0.0005 + n.ph); n.cy = n.y + m * 7 * Math.cos(now * 0.00043 + n.ph);
        var on = hover === n.k, dim = hover >= 0 && !on;
        n.g.setAttribute('transform', 'translate(' + n.cx.toFixed(1) + ' ' + n.cy.toFixed(1) + ')' + (on ? ' scale(1.07)' : ''));
        n.a.style.opacity = dim ? 0.35 : 1;
        // El vínculo va del borde del centro al borde del nodo
        var dx = n.cx - HX, dy = n.cy - HY, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d;
        var x1 = HX + ux * (HR + 30), y1 = HY + uy * (HR + 30), x2 = n.cx - ux * (n.r + 22), y2 = n.cy - uy * (n.r + 22);
        n.spoke.setAttribute('x1', x1.toFixed(1)); n.spoke.setAttribute('y1', y1.toFixed(1)); n.spoke.setAttribute('x2', x2.toFixed(1)); n.spoke.setAttribute('y2', y2.toFixed(1));
        n.spoke.style.opacity = dim ? 0.15 : 1; n.spoke.style.strokeWidth = on ? 3 : '';
        var tk = tickAt(n, (HR + 30) / d + 0.04);
        n.tick.setAttribute('x1', tk[0].toFixed(1)); n.tick.setAttribute('y1', tk[1].toFixed(1)); n.tick.setAttribute('x2', tk[2].toFixed(1)); n.tick.setAttribute('y2', tk[3].toFixed(1));
        n.tick.style.opacity = dim ? 0.15 : 1;
        var f = reduce ? 0.5 : ((now / 2800 + n.k / N.length) % 1);
        n.spark.setAttribute('cx', (x1 + (x2 - x1) * f).toFixed(1)); n.spark.setAttribute('cy', (y1 + (y2 - y1) * f).toFixed(1));
        n.spark.style.opacity = dim ? 0 : (reduce ? 0 : Math.sin(f * Math.PI).toFixed(2));
      });
      peers.forEach(function (o) {
        var on = hover === o.a.k || hover === o.b.k;
        o.e.setAttribute('x1', o.a.cx.toFixed(1)); o.e.setAttribute('y1', o.a.cy.toFixed(1)); o.e.setAttribute('x2', o.b.cx.toFixed(1)); o.e.setAttribute('y2', o.b.cy.toFixed(1));
        o.e.style.opacity = hover >= 0 ? (on ? 0.9 : 0.08) : 0.55;
      });
      decor.forEach(function (d) {
        var dx = m * d.a * Math.sin(now * d.sp + d.ph), dy = m * d.a * Math.cos(now * d.sp * 0.8 + d.ph);
        d.e.setAttribute('cx', (d.x + dx).toFixed(1)); d.e.setAttribute('cy', (d.y + dy).toFixed(1));
        d.e.style.opacity = hover >= 0 ? 0.25 : 0.8;
      });
      placeTip();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    if (!svg._rs) {
      svg._rs = true; var lastMode = mode;
      window.addEventListener('resize', function () {
        if (!svg.isConnected) return;
        var nm = wrap.clientWidth < 620 ? 'tall' : 'wide';
        if (nm !== lastMode) { lastMode = nm; tip.hidden = true; runNet(svg); }
      });
    }
  }

  /* =========================================================
     RUTEO
     ========================================================= */
  var CA = { 'que-es': vQueEs, 'quienes-somos': vQueEs, 'nosotros': vProposito, 'proposito': vProposito, 'cultura': vCultura, 'equipo': vEquipo, 'anuarios': vAnuarios };
  var TITULOS = { ca: 'Córdoba Acelera', programas: 'programas', agenda: 'agenda', novedades: 'novedades', metas: 'metas' };
  function route() {
    var h = (location.hash || '#inicio').slice(1), html, section = h;
    if (CA[h]) { html = CA[h](); section = 'ca'; }
    else switch (h) {
      case 'programas': html = vProgramas(); break;
      case 'metas': html = vMetas(); break;
      case 'novedades': html = vNovedades(); break;
      case 'agenda': case 'eventos': html = vAgenda(); section = 'agenda'; break;
      default: html = vInicio(); section = 'inicio';
    }
    view.className = 'view v-' + section + (h === 'programas' ? ' v-prog' : '');
    view.innerHTML = html;
    wireLogos(); wireVideos(); wireHelix();
    void view.offsetWidth;
    view.classList.add('enter');
    closeMenu();
    root.querySelectorAll('[data-nav]').forEach(function (a) {
      if (a.getAttribute('data-nav') === section) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.title = (section !== 'inicio' ? (section === 'ca' ? 'Córdoba Acelera' : u(TITULOS[section] || section)) + ' | ' : '') + 'Córdoba Acelera';
    if (!first) {
      window.scrollTo({ top: root.getBoundingClientRect().top + window.scrollY, behavior: 'auto' });
      var h1 = view.querySelector('h1'); if (h1) h1.focus({ preventScroll: true });
    }
    first = false;
  }
  function wireLogos() {
    view.querySelectorAll('img[data-logo]').forEach(function (img) {
      var box = img.closest('.plogo'); var fail = function () { if (box) box.classList.add('nologo'); };
      img.addEventListener('error', fail); if (img.complete && img.naturalWidth === 0) fail();
    });
  }
  function wireVideos() {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    view.querySelectorAll('.vhero').forEach(function (s) {
      var v = s.querySelector('video'), b = s.querySelector('[data-vplay]');
      function set(paused) { b.innerHTML = paused ? ICONS.play : ICONS.pause; b.setAttribute('aria-label', paused ? u('reproducir') : u('pausar')); }
      v.muted = true;
      if (reduce) { v.removeAttribute('autoplay'); v.pause(); set(true); }
      else { var pr = v.play(); if (pr && pr.catch) pr.catch(function () { set(true); }); }
      b.addEventListener('click', function () { if (v.paused) { v.play(); set(false); } else { v.pause(); set(true); } });
    });
  }

  /* ---------- Menú (escritorio y celular) ---------- */
  var nav = document.getElementById('cba-nav'), burger = root.querySelector('.burger');
  function closeDrops(except) {
    nav.querySelectorAll('button.nl').forEach(function (b) {
      if (b !== except) { b.setAttribute('aria-expanded', 'false'); var d = document.getElementById(b.getAttribute('aria-controls')); if (d) d.classList.remove('open'); }
    });
  }
  function closeMenu() { closeDrops(); nav.classList.remove('open'); burger.setAttribute('aria-expanded', 'false'); document.documentElement.classList.remove('cba-lock'); }
  function wireDrops() {
    nav.querySelectorAll('button.nl').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var d = document.getElementById(b.getAttribute('aria-controls')), open = !d.classList.contains('open');
        closeDrops(b); d.classList.toggle('open', open); b.setAttribute('aria-expanded', String(open));
      });
    });
  }
  burger.addEventListener('click', function () {
    var o = nav.classList.toggle('open'); burger.setAttribute('aria-expanded', String(o));
    document.documentElement.classList.toggle('cba-lock', o);
  });
  nav.addEventListener('click', function (e) { if (e.target.closest('a')) closeMenu(); });
  document.addEventListener('click', function (e) { if (!nav.contains(e.target) && !burger.contains(e.target)) closeDrops(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });

  // Idioma
  root.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      LANG = b.getAttribute('data-lang');
      try { localStorage.setItem('cba-lang', LANG); } catch (e) {}
      buildChrome(); first = true; var y = window.scrollY; route(); window.scrollTo(0, y);
    });
  });

  // Clics dentro de las vistas
  view.addEventListener('click', function (e) {
    var fl = e.target.closest('.flip');
    if (fl && fl.dataset.href && !e.target.closest('a') && window.matchMedia('(hover: hover)').matches) { location.hash = fl.dataset.href; return; }
    if (fl && !e.target.closest('a')) { fl.classList.toggle('is-flipped'); return; }
    var mf = e.target.closest('[data-mfilter]');
    if (mf) { view.querySelector('.mlist').innerHTML = metasList(mf.getAttribute('data-mfilter'));
      view.querySelectorAll('[data-mfilter]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === mf)); }); return; }
    var ac = e.target.closest('[data-ag-cat]');
    if (ac) { agCat = ac.getAttribute('data-ag-cat'); agMax = 20; pintarAgenda(); return; }
    var dd = e.target.closest('[data-ag-day]');
    if (dd) {
      agDay = agDay === dd.getAttribute('data-ag-day') ? null : dd.getAttribute('data-ag-day'); agMax = 20; pintarAgenda();
      if (agDay && window.innerWidth < 1000) { var c = view.querySelector('[data-ag-count]'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      return;
    }
    var am = e.target.closest('[data-ag-mes]');
    if (am) { agMonth = new Date(agMonth.getFullYear(), agMonth.getMonth() + (+am.getAttribute('data-ag-mes')), 1); view.querySelector('[data-ag-cal]').innerHTML = calendario(); return; }
    if (e.target.closest('[data-ag-clear]')) { agDay = null; pintarAgenda(); return; }
    if (e.target.closest('[data-ag-more]')) { agMax += 20; view.querySelector('[data-ag-list]').innerHTML = agendaList(); }
  });
  view.addEventListener('input', function (e) {
    if (e.target.matches('[data-ag-q]')) { agQ = e.target.value; agMax = 20; view.querySelector('[data-ag-list]').innerHTML = agendaList(); }
  });

  buildChrome();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
